<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#0f1115"
    >

    <meta
        name="robots"
        content="noindex, follow"
    >

    <meta
        name="description"
        content="The requested page could not be found in Junlong He’s engineering portfolio."
    >

    <!--
        Deployment lesson:

        GitHub user site or custom domain:
        content="/"

        GitHub project site:
        content="/REPOSITORY-NAME/"

        Leaving this empty enables automatic detection.
    -->

    <meta
        name="site-base"
        content="/"
    >

    <title>Page Not Found | Junlong He Engineering Portfolio</title>


    <script>
        (function () {
            const savedTheme =
                localStorage.getItem(
                    "ee-portfolio-theme"
                );

            const systemUsesLight =
                window.matchMedia(
                    "(prefers-color-scheme: light)"
                ).matches;

            const theme =
                savedTheme === "light" ||
                savedTheme === "dark"
                    ? savedTheme
                    : systemUsesLight
                        ? "light"
                        : "dark";

            document.documentElement
                .dataset
                .theme = theme;
        })();
    </script>


    <style>
        :root {
            color-scheme: dark;

            --background: #0f1115;
            --surface: #181b22;
            --surface-hover: #1f232c;
            --border: #2a2f3a;

            --text-primary: #f7f8fa;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;

            --accent: #4f8cff;
            --accent-hover: #6da0ff;
        }

        html[data-theme="light"] {
            color-scheme: light;

            --background: #f5f7fb;
            --surface: #ffffff;
            --surface-hover: #eef2f8;
            --border: #d8dee9;

            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;

            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;

            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;

            background: var(--background);
        }

        body {
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 1.5rem;

            background:
                radial-gradient(
                    circle at top,
                    color-mix(
                        in srgb,
                        var(--accent) 13%,
                        transparent
                    ),
                    transparent 42%
                ),
                var(--background);

            color: var(--text-primary);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .error-card {
            width: min(100%, 720px);

            padding: clamp(
                1.5rem,
                5vw,
                3.5rem
            );

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 24px;

            text-align: center;
        }

        .error-code {
            display: inline-flex;

            padding: 0.4rem 0.75rem;

            margin-bottom: 1.25rem;

            background:
                color-mix(
                    in srgb,
                    var(--accent) 12%,
                    transparent
                );

            color: var(--accent);

            border:
                1px solid
                color-mix(
                    in srgb,
                    var(--accent) 30%,
                    transparent
                );

            border-radius: 999px;

            font-size: 0.78rem;
            font-weight: 700;

            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(
                2.6rem,
                10vw,
                5rem
            );

            line-height: 0.98;
            letter-spacing: -0.055em;

            margin-bottom: 1rem;
        }

        .error-description {
            max-width: 560px;

            margin-inline: auto;
            margin-bottom: 1.75rem;

            color: var(--text-secondary);

            font-size: 1rem;
            line-height: 1.7;
        }

        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;

            gap: 0.75rem;
        }

        .error-button {
            min-height: 46px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0.75rem 1.1rem;

            border:
                1px solid
                var(--border);

            border-radius: 999px;

            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition:
                background-color 160ms ease,
                border-color 160ms ease,
                color 160ms ease,
                transform 160ms ease;
        }

        .error-button-primary {
            background: var(--accent);
            color: #ffffff;

            border-color: var(--accent);
        }

        .error-button-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);

            transform: translateY(-1px);
        }

        .error-button-secondary {
            background: transparent;
            color: var(--text-secondary);
        }

        .error-button-secondary:hover {
            background: var(--surface-hover);
            color: var(--text-primary);

            transform: translateY(-1px);
        }

        .error-button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .error-path {
            margin-top: 1.75rem;

            color: var(--text-muted);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 0.78rem;
            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        @media (max-width: 520px) {
            .error-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .error-button {
                width: 100%;
            }
        }

        @media (hover: none) {
            .error-button:hover {
                transform: none;
            }
        }
    </style>

</head>


<body>

    <main class="error-card">

        <p class="error-code">
            Error 404
        </p>

        <h1>
            Page not found.
        </h1>

        <p class="error-description">
            The page may have been moved, renamed, or removed.
            Return to the engineering portfolio or go back to the
            previous page.
        </p>


        <div class="error-actions">

            <a
                class="
                    error-button
                    error-button-primary
                "
                id="error-home-link"
                href="/"
            >
                Return Home
            </a>

            <button
                class="
                    error-button
                    error-button-secondary
                "
                id="error-back-button"
                type="button"
            >
                Go Back
            </button>

        </div>


        <p
            class="error-path"
            id="error-path"
        ></p>

    </main>


    <script>
        (function () {
            const homeLink =
                document.querySelector(
                    "#error-home-link"
                );

            const backButton =
                document.querySelector(
                    "#error-back-button"
                );

            const pathOutput =
                document.querySelector(
                    "#error-path"
                );

            const configuredBase =
                document.querySelector(
                    'meta[name="site-base"]'
                )
                    ?.getAttribute("content")
                    ?.trim();


            function normalizeBasePath(path) {
                if (!path) {
                    return "";
                }

                const leadingSlash =
                    path.startsWith("/")
                        ? path
                        : `/${path}`;

                return leadingSlash.endsWith("/")
                    ? leadingSlash
                    : `${leadingSlash}/`;
            }


            function detectSiteBase() {
                if (configuredBase) {
                    return normalizeBasePath(
                        configuredBase
                    );
                }

                const isGitHubPages =
                    window.location.hostname
                        .endsWith(".github.io");

                const pathParts =
                    window.location.pathname
                        .split("/")
                        .filter(Boolean);

                if (
                    isGitHubPages &&
                    pathParts.length > 0
                ) {
                    return `/${pathParts[0]}/`;
                }

                return "/";
            }


            if (homeLink) {
                homeLink.href =
                    detectSiteBase();
            }


            if (backButton) {
                backButton.addEventListener(
                    "click",
                    function () {
                        if (
                            window.history.length > 1
                        ) {
                            window.history.back();
                            return;
                        }

                        window.location.href =
                            detectSiteBase();
                    }
                );
            }


            if (pathOutput) {
                pathOutput.textContent =
                    `Requested path: ` +
                    window.location.pathname;
            }
        })();
    </script>

</body>

</html>
