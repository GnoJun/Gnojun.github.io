<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="theme-color"
        content="#0b1323"
    >

    <meta
        name="robots"
        content="noindex, follow"
    >

    <meta
        name="description"
        content="The requested page could not be found in Junlong He’s engineering portfolio."
    >

    <!--
        Deployment lesson:

        GitHub user site or custom domain:
        content="/"

        GitHub project site:
        content="/REPOSITORY-NAME/"

        Leaving this empty enables automatic detection.
    -->

    <meta
        name="site-base"
        content="/"
    >

    <title>Page Not Found | Junlong He Engineering Portfolio</title>

    <script src="/js/theme-init.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>


<body class="site-page site-error-page">

    <main class="error-card container" id="main-content">

        <p class="error-code">
            Error 404
        </p>

        <h1 class="page-heading">
            Page not found.
        </h1>

        <p class="error-description">
            The page may have been moved, renamed, or removed.
            Return to the engineering portfolio or go back to the
            previous page.
        </p>


        <div class="error-actions">

            <a
                class="
                    button
                    button-primary
                "
                id="error-home-link"
                href="/"
            >
                Return Home
            </a>

            <button
                class="
                    button
                    button-secondary
                "
                id="error-back-button"
                type="button"
            >
                Go Back
            </button>

        </div>


        <p
            class="error-path"
            id="error-path"
        ></p>

    </main>


    <script>
        (function () {
            const homeLink =
                document.querySelector(
                    "#error-home-link"
                );

            const backButton =
                document.querySelector(
                    "#error-back-button"
                );

            const pathOutput =
                document.querySelector(
                    "#error-path"
                );

            const configuredBase =
                document.querySelector(
                    'meta[name="site-base"]'
                )
                    ?.getAttribute("content")
                    ?.trim();


            function normalizeBasePath(path) {
                if (!path) {
                    return "";
                }

                const leadingSlash =
                    path.startsWith("/")
                        ? path
                        : `/${path}`;

                return leadingSlash.endsWith("/")
                    ? leadingSlash
                    : `${leadingSlash}/`;
            }


            function detectSiteBase() {
                if (configuredBase) {
                    return normalizeBasePath(
                        configuredBase
                    );
                }

                const isGitHubPages =
                    window.location.hostname
                        .endsWith(".github.io");

                const pathParts =
                    window.location.pathname
                        .split("/")
                        .filter(Boolean);

                if (
                    isGitHubPages &&
                    pathParts.length > 0
                ) {
                    return `/${pathParts[0]}/`;
                }

                return "/";
            }


            if (homeLink) {
                homeLink.href =
                    detectSiteBase();
            }


            if (backButton) {
                backButton.addEventListener(
                    "click",
                    function () {
                        if (
                            window.history.length > 1
                        ) {
                            window.history.back();
                            return;
                        }

                        window.location.href =
                            detectSiteBase();
                    }
                );
            }


            if (pathOutput) {
                pathOutput.textContent =
                    `Requested path: ` +
                    window.location.pathname;
            }
        })();
    </script>

</body>

</html>
